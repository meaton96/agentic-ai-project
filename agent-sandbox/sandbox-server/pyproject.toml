[project]
name = "sandbox-server"
version = "0.1.0"
description = "FastAPI server wrapping sandbox-core: agent CRUD, credential writes, run launch + live/historical event streaming"
requires-python = ">=3.11"
dependencies = [
    "sandbox-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
