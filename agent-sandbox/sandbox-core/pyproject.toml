[project]
name = "sandbox-core"
version = "0.1.0"
description = "Core schemas and headless agent runtime for the agent-sandbox project"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "mcp>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "strands-agents[openai]>=1.53.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sandbox = "sandbox_core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
