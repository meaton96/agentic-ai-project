[project]
name = "sandbox-core"
version = "0.1.0"
description = "Core data schemas for the agent-sandbox project"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
