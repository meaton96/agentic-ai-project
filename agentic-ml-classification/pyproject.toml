[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ml"
version = "0.1.0"
description = "Agentic ML classification pipeline: LLM agents propose, deterministic harness decides"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

# Ships agentic_ml/prompts/*.md inside the built package (wheel/sdist and
# `pip install --target`) rather than relying on them sitting at the repo
# root — see prompt_loader.py's module docstring for why that mattered:
# a `--target` install only ever carries this package's own file tree.
[tool.setuptools.package-data]
agentic_ml = ["prompts/*.md"]