services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    image: agentic-ml-openclaw:local
    container_name: openclaw-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./config}:/home/node/.openclaw:rw
      - ${OPENCLAW_WORKSPACE_DIR:-./workspace}:/home/node/.openclaw/workspace:rw
      - openclaw-secrets:/home/node/.config/openclaw
    environment:
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      RIT_API_KEY: ${RIT_API_KEY:?RIT_API_KEY must be set in .env}
      OPENCLAW_SKIP_ONBOARDING: "1"
      OPENCLAW_DISABLE_BONJOUR: "1"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # Sidecar for onboarding/admin commands, e.g.:
  #   docker compose run --rm openclaw-cli dashboard --no-open
  #   docker compose run --rm openclaw-cli models list --provider vllm
  # Shares the gateway's network namespace (127.0.0.1 reaches the gateway).
  openclaw-cli:
    # Reuses the image built by openclaw-gateway (same tag) — no separate
    # build section needed. `docker compose build` only builds services
    # that declare `build:`, so this just references that result.
    image: agentic-ml-openclaw:local
    container_name: openclaw-cli
    network_mode: "service:openclaw-gateway"
    depends_on:
      - openclaw-gateway
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./config}:/home/node/.openclaw:rw
      - ${OPENCLAW_WORKSPACE_DIR:-./workspace}:/home/node/.openclaw/workspace:rw
      - openclaw-secrets:/home/node/.config/openclaw
    environment:
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      RIT_API_KEY: ${RIT_API_KEY:?RIT_API_KEY must be set in .env}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    profiles:
      - cli
    entrypoint: [ "node", "dist/index.js" ]

volumes:
  openclaw-secrets:
