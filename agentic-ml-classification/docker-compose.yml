# Model gateway only. The agent runtime (src/agentic_ml) runs as plain
# Python on the host / in your own process — it is NOT a container here,
# since it has no daemon, no session state, and nothing to keep alive.
# See README.md for why OpenClaw was dropped from this stack.
services:
  model-gateway:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: model-gateway
    restart: unless-stopped
    env_file:
      - .env
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    ports:
      - "127.0.0.1:${MODEL_GATEWAY_PORT:-4000}:4000"
    volumes:
      - ./configs/litellm.yaml:/app/config.yaml:ro
    extra_hosts:
      # only relevant if LOCAL_MODEL_BASE_URL points at a server running
      # on this host machine (e.g. a local vLLM/Ollama instance)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/liveliness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
