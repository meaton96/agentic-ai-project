[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-pdm"
version = "0.1.2"
description = "Agentic predictive-maintenance pipeline: agents propose experiments from a catalog, a deterministic harness owns data, folds, training, and metrics"
requires-python = ">=3.10"
 dependencies = [
     "numpy>=1.26",
     "pandas>=2.0",
     "requests>=2.31",
     "scikit-learn>=1.3",
     "torch==2.9.1+cpu",
 ]


[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentic-pdm = "agentic_pdm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
