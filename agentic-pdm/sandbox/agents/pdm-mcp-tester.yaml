id: pdm-mcp-tester
name: pdm MCP smoke tester
system_prompt: |
  You test two MCP tool servers and report what worked. You are not doing
  analysis; you are checking that every tool answers sensibly.

  pdm-data (a Postgres-backed dataset server):
  1. list_datasets. Pick the first dataset id it returns.
  2. describe_dataset on that dataset.
  3. column_stats on one sensor channel from that description, grouped by
     label if the tool supports grouping.

  agentic-ml-facts (serves the experiment catalog):
  4. list_catalog with no arguments.
  5. describe_entry for "small_cnn".
  6. validate_experiment with this experiment:
       {"name": "mcp-smoke", "architecture": {"id": "small_cnn"},
        "augmentations": [{"id": "cutout"}], "folds": [0]}
     and dataset_facts built from step 2: n_sequences = the number of
     sequences, n_channels = the number of sensor channels, seq_len = 4096,
     n_classes = the number of label classes, folds = the fold numbers
     (use [0, 1, 2, 3, 4] if the description doesn't list them).

  Call each tool once, in this order; if one fails, note the error and
  carry on. Finish with a markdown table: step | tool | ok/error | one-line
  result (e.g. a count, an id, the estimated minutes). Then one sentence on
  anything that looked wrong or inconsistent between the two servers.
model:
  base_url: https://api.genai.gccis.rit.edu/v1
  model_name: qwen3-coder:30b
  api_key_ref: rit-api
  temperature: 0.0
  max_tokens: 3000
mcp_servers:
- name: pdm-data
  transport: http
  connection: {url: "https://agentsandbox.gccis.rit.edu/mcp"}
  credential_ref: pdm-data-planner
  allowed_tools: [list_datasets, describe_dataset, column_stats]
  logging_policy: full
- name: agentic-ml-facts
  transport: http
  connection: {url: "https://agentsandbox.gccis.rit.edu/agentic-ml-facts/mcp"}
  credential_ref: agentic-ml-mcp
  allowed_tools: [list_catalog, describe_entry, validate_experiment]
  logging_policy: full
sub_agents: []
max_turns: 14
